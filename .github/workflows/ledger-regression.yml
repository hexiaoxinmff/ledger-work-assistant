name: Ledger reconciliation regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-tests:
    env:
      PYTHONUTF8: "1"
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install pandas==3.0.1 openpyxl==3.1.5 PyYAML==6.0.3
      - name: Run synthetic ledger regression suite
        run: python -m unittest discover -s ledger-organizer/tools/fcs-adapted/tests -v
      - name: Run skill discovery safety regression
        run: python -m unittest discover -s ledger-organizer/tools/skill-discovery/tests -v
