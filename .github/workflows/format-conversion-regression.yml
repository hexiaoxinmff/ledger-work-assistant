name: Format conversion regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion-tests:
    env:
      PYTHONUTF8: "1"
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Run format conversion regression suite
        run: python -m unittest discover -s ledger-organizer/tools/format-conversion/tests -v

      - name: Run DOCX extraction regression suite
        run: python -m unittest discover -s ledger-organizer/tools/document-to-excel/tests -v
