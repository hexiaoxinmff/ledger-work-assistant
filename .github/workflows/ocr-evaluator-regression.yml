name: OCR field evaluator regression

on:
  push:
    branches:
      - main
      - codex/ocr-field-evaluator
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run OCR evaluator regression tests
        run: python -m unittest discover -s ledger-organizer/tools/local-ocr/tests -p test_evaluate_accuracy.py -v

      - name: Run OCR output safety regression tests
        run: python -m unittest discover -s ledger-organizer/tools/local-ocr/tests -p test_image_output_safety.py -v

      - name: Install XLSX review test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Run grid JSON and review workbook output safety tests
        run: python -m unittest discover -s ledger-organizer/tools/local-ocr/tests -p test_grid_output_safety.py -v
